<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>C++ Showcase</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="landing">
    <p id="heading">C++ Showcase</p>
    <div id="list"></div>
  </div>

  <div id="view" hidden>
    <div id="nav">
      <button id="back">← back</button>
      <span id="vtitle"></span>
    </div>
    <div id="split">
      <pre id="cpre"><code id="code"></code></pre>
      <div id="term">
        <pre id="out"></pre>
        <textarea id="stdin" placeholder="stdin…"></textarea>
        <div id="bar">
          <button id="eg">example</button>
          <button id="clr">clear</button>
          <button id="run">▶ run</button>
          <span id="st"></span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
