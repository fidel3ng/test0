<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C++ Terminal Showcase</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Landing ── -->
    <section id="landing">
      <header class="hero">
        <div class="hero-terminal" id="hero-terminal" aria-hidden="true">
          <div class="term-bar">
            <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            <span class="term-title">bash</span>
          </div>
          <div class="term-body" id="hero-lines"></div>
        </div>
        <div class="hero-text">
          <div class="badge">Live C++ in the Browser</div>
          <h1>Terminal <em>Showcase</em></h1>
          <p>Five C++ programs — real source code, real execution, zero plugins.</p>
        </div>
      </header>
      <div id="cards-grid" class="cards-grid"></div>
    </section>

    <!-- ── Project view ── -->
    <section id="project-view" class="hidden">
      <nav class="topnav">
        <button id="back-btn" class="back-btn">&#8592; All Projects</button>
        <span id="nav-title" class="nav-title"></span>
        <span class="lang-badge">C++17</span>
      </nav>

      <div class="split">
        <!-- Left: source code -->
        <div class="pane code-pane">
          <div class="pane-header">
            <div class="wm-dots">
              <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            </div>
            <span class="pane-title">source.cpp</span>
            <button id="copy-btn" class="icon-btn" title="Copy source">⎘ Copy</button>
          </div>
          <pre id="code-pre"><code id="code-display" class="language-cpp"></code></pre>
        </div>

        <!-- Right: terminal -->
        <div class="pane term-pane">
          <div class="pane-header">
            <div class="wm-dots">
              <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            </div>
            <span class="pane-title" id="term-title">terminal</span>
            <button id="clear-btn" class="icon-btn" title="Clear output">&#x2715; Clear</button>
          </div>
          <div class="term-output" id="term-output">
            <pre id="output-pre"></pre>
            <span class="cursor" id="cursor"></span>
          </div>
          <div class="stdin-area">
            <div class="stdin-toolbar">
              <label class="stdin-label">stdin</label>
              <span id="stdin-hint" class="stdin-hint"></span>
              <button id="example-btn" class="btn-ghost">Load example</button>
            </div>
            <textarea id="stdin-input" class="stdin-textarea"
              placeholder="Enter program inputs here (one value per line or space-separated)…"></textarea>
            <div class="run-bar">
              <span id="status-msg" class="status-msg"></span>
              <button id="run-btn" class="run-btn">
                <span class="run-icon">&#9654;</span> Run Program
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
